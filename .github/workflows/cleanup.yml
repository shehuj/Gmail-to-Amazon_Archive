name: Clean up Gmail mailbox

# Moves archived *and verified* messages to Gmail Trash. Never empties Trash.
# Defaults to a dry run; a real run needs dry_run unchecked and confirm = TRASH.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: only report how many messages would be trashed"
        type: boolean
        default: true
      confirm:
        description: "Type TRASH to confirm a real run (ignored for dry runs)"
        required: false
        default: ""
      limit:
        description: "Max messages to trash this run (0 = all verified messages)"
        required: false
        default: "0"
      workers:
        description: "Parallel requests"
        required: false
        default: "8"
      max_runtime:
        description: "Minutes before stopping cleanly (job limit is 6h)"
        required: false
        default: "330"

permissions:
  contents: read
  id-token: write # OIDC token for assuming the AWS role

# Shared with the ingest workflow so the S3 state database is never written concurrently.
concurrency:
  group: gmail-archive-state
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Store GMAIL_TOKEN_MODIFY as a secret of this environment, and optionally add
    # required reviewers to it, so only approved cleanup runs can modify the mailbox.
    environment: mailbox-cleanup
    env:
      # Each setting can be a repository variable or a secret.
      AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
      STATE_URI: s3://${{ vars.S3_BUCKET || secrets.S3_BUCKET }}/state/archive_state.sqlite3
      USE_OIDC_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
    steps:
      - name: Check confirmation
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$CONFIRM" != "TRASH" ]; then
            echo "::error::Real cleanup requires the confirm input to be exactly TRASH."
            exit 1
          fi

      - name: Check configuration
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
          HAS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
          HAS_SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY != '' }}
          HAS_GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN_MODIFY != '' }}
          NEED_GMAIL_TOKEN: ${{ !inputs.dry_run }}
        run: |
          missing=()
          [ -n "$AWS_REGION" ] || missing+=("AWS_REGION (repository variable or secret, e.g. us-east-1)")
          [ -n "$S3_BUCKET" ] || missing+=("S3_BUCKET (repository variable or secret, e.g. gmailstore)")
          if [ "$USE_OIDC_ROLE" != "true" ] && { [ "$HAS_KEY_ID" != "true" ] || [ "$HAS_SECRET_KEY" != "true" ]; }; then
            missing+=("AWS_ROLE_ARN secret, or both AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets")
          fi
          if [ "$NEED_GMAIL_TOKEN" = "true" ] && [ "$HAS_GMAIL_TOKEN" != "true" ]; then
            missing+=("GMAIL_TOKEN_MODIFY secret (contents of token_modify.json from 'python archive.py --mode login')")
          fi
          for m in "${missing[@]}"; do echo "::error::Missing $m"; done
          [ ${#missing[@]} -eq 0 ] || exit 1
          if [ "$USE_OIDC_ROLE" = "true" ]; then echo "AWS auth: OIDC role"; else echo "AWS auth: access keys"; fi

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC role)
        if: env.USE_OIDC_ROLE == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600

      - name: Configure AWS credentials (access keys)
        if: env.USE_OIDC_ROLE != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download state database
        id: state
        run: |
          if ! aws s3 ls "$STATE_URI" > /dev/null 2>&1; then
            echo "::error::No state database at $STATE_URI. Run the ingest workflow first."
            exit 1
          fi
          aws s3 cp "$STATE_URI" archive_state.sqlite3

      - name: Dry run
        if: inputs.dry_run
        env:
          LIMIT: ${{ inputs.limit }}
        run: python archive.py --mode cleanup --dry-run --limit "$LIMIT"

      - name: Write Gmail token
        if: ${{ !inputs.dry_run }}
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN_MODIFY }}
        run: |
          if [ -z "$GMAIL_TOKEN" ]; then
            echo "::error::Secret GMAIL_TOKEN_MODIFY is not set. Run 'python archive.py --mode login' locally."
            exit 1
          fi
          umask 077
          printf '%s' "$GMAIL_TOKEN" > token_modify.json

      - name: Move verified messages to Trash
        id: cleanup
        if: ${{ !inputs.dry_run }}
        env:
          LIMIT: ${{ inputs.limit }}
          WORKERS: ${{ inputs.workers }}
          MAX_RUNTIME: ${{ inputs.max_runtime }}
        run: |
          python archive.py --mode cleanup --confirm --yes \
            --limit "$LIMIT" --workers "$WORKERS" --max-runtime "$MAX_RUNTIME"

      - name: Upload state database
        # Records which messages were trashed, even if the run failed part-way.
        if: always() && steps.state.outcome == 'success' && !inputs.dry_run
        run: |
          python -c "import sqlite3,sys; r=sqlite3.connect('archive_state.sqlite3').execute('PRAGMA integrity_check').fetchone()[0]; sys.exit(r != 'ok')"
          aws s3 cp archive_state.sqlite3 "$STATE_URI"

      - name: Job summary
        if: always() && steps.state.outcome == 'success'
        run: |
          {
            echo '### Gmail archive state'
            echo '```'
            python archive.py --mode status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
